plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        .every { keystoreProperties[it] }

android {
    namespace "com.local.courseschedule"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.courseschedule"
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName "1.4.0"
        buildConfigField "String", "UPDATE_REPOSITORY", '"Plonkloving/CourseApp"'
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../app"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) release {
            storeFile rootProject.file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
